<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NHL Calendar 2026-27 — Every Game, Every Team, Live Scores</title>
    <meta name="description" content="Free NHL calendar with live scores, goal notifications, team-colored pills, week view, and favorite teams. No login, no ads, works on phone and desktop.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="stylesheet" href="styles.css">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nhl-calendar26-27.vercel.app/">
    <meta property="og:title" content="NHL Calendar 2026-27 — Every Game, Every Team, Live Scores">
    <meta property="og:description" content="Free NHL calendar with live scores, goal notifications, team-colored pills, week view, and favorite teams. No login, no ads, works on phone and desktop.">
    <meta property="og:image" content="https://nhl-calendar26-27.vercel.app/og-image.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:site_name" content="NHL Calendar 2026-27">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NHL Calendar 2026-27 — Every Game, Every Team, Live Scores">
    <meta name="twitter:description" content="Free NHL calendar with live scores, goal notifications, team-colored pills, week view, and favorite teams.">
    <meta name="twitter:image" content="https://nhl-calendar26-27.vercel.app/og-image.png">
</head>
<body>
    <div class="container">
        <div class="sticky-top">
            <header>
                <button id="prevMonth" class="nav-button">&lt;</button>
                <h1 id="monthTitle">October 2026</h1>
                <button id="nextMonth" class="nav-button">&gt;</button>
            </header>

            <div id="favCountdown" class="fav-countdown hidden" role="status"></div>

            <div id="todayStrip" class="today-strip">
                <!-- Today's games chips will be generated by JavaScript -->
            </div>

            <div class="view-toggle">
                <button id="viewMonth" class="view-tab active" type="button">Month</button>
                <button id="viewWeek" class="view-tab" type="button">Week</button>
                <button id="viewMyTeams" class="view-tab" type="button">My Teams</button>
            </div>

            <div id="dayHeaders" class="day-headers-row"></div>
        </div>

        <div id="loading" class="loading">Loading NHL schedule...</div>
        <div id="error" class="error hidden"></div>

        <div id="calendar" class="calendar-grid">
            <!-- Calendar days will be generated by JavaScript -->
        </div>

        <div id="weekView" class="week-view hidden">
            <!-- Week cards will be generated by JavaScript -->
        </div>

        <div id="myTeamsView" class="myteams-view hidden">
            <!-- Favorite-team games for the displayed month, generated by JavaScript -->
        </div>

        <div id="gameDetails" class="game-details hidden">
            <button id="closeDetails" class="close-button">&times;</button>
            <h2 id="detailsTitle">Game Details</h2>
            <div id="detailsContent"></div>
        </div>
    </div>

    <!-- Floating 'Jump to Today' button - always visible, lets the user
         quickly return to today's date after scrolling through other months. -->
    <button id="todayJump" class="today-jump hidden" type="button" aria-label="Jump to today" title="Jump to today">
        <span class="today-jump-icon">&#9745;</span>
        <span class="today-jump-label">Today</span>
    </button>

    <script src="app.js"></script>
</body>
</html>
