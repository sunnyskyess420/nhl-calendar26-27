<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NHL Calendar</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sticky-top">
            <header>
                <button id="prevMonth" class="nav-button">&lt;</button>
                <h1 id="monthTitle">October 2026</h1>
                <button id="nextMonth" class="nav-button">&gt;</button>
            </header>

            <div id="todayStrip" class="today-strip">
                <!-- Today's games chips will be generated by JavaScript -->
            </div>

            <div class="view-toggle">
                <button id="viewMonth" class="view-tab active" type="button">Month</button>
                <button id="viewWeek" class="view-tab" type="button">Week</button>
            </div>

            <div id="dayHeaders" class="day-headers-row"></div>
        </div>

        <div id="loading" class="loading">Loading NHL schedule...</div>
        <div id="error" class="error hidden"></div>

        <div id="calendar" class="calendar-grid">
            <!-- Calendar days will be generated by JavaScript -->
        </div>

        <div id="weekView" class="week-view hidden">
            <!-- Week cards will be generated by JavaScript -->
        </div>

        <div id="gameDetails" class="game-details hidden">
            <button id="closeDetails" class="close-button">&times;</button>
            <h2 id="detailsTitle">Game Details</h2>
            <div id="detailsContent"></div>
        </div>
    </div>

    <!-- Floating 'Jump to Today' button - always visible, lets the user
         quickly return to today's date after scrolling through other months. -->
    <button id="todayJump" class="today-jump hidden" type="button" aria-label="Jump to today" title="Jump to today">
        <span class="today-jump-icon">&#9745;</span>
        <span class="today-jump-label">Today</span>
    </button>

    <script src="app.js"></script>
</body>
</html>
